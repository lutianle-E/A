    <!-- 自包含 drop-in：flx- 前缀隔离，不依赖外部 CSS/JS，注入到 </body> 前即可。 -->
    <style>
    .flx-card-float{
      --flx-accent:#a3e635; --flx-accent2:#22d3ee; --flx-bg:#0b0c12; --flx-surface:#15171f;
      --flx-text:#f4f5f7; --flx-dim:#9aa0ad;
      --flx-head:'Space Grotesk','Archivo',system-ui,sans-serif; --flx-mono:ui-monospace,'JetBrains Mono',monospace;
      position:fixed; top:92px; right:36px; width:288px; height:420px;
      z-index:2147483000; pointer-events:none; font-family:var(--flx-head);
      user-select:none; -webkit-user-select:none; box-sizing:border-box;
    }
    .flx-card-float *{ box-sizing:border-box; }
    .flx-card__band{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:1; }
    .flx-card{ position:absolute; left:0; top:0; width:232px; height:300px; z-index:2; cursor:grab; pointer-events:auto; will-change:transform; touch-action:none; perspective:1200px; }
    .flx-card:active{ cursor:grabbing; }
    .flx-card__inner{ position:relative; width:100%; height:100%; transform-style:preserve-3d; will-change:transform; }
    .flx-card__face{ position:absolute; inset:0; border-radius:16px; backface-visibility:hidden; -webkit-backface-visibility:hidden; padding:22px 22px 20px; display:flex; flex-direction:column; background:linear-gradient(160deg, color-mix(in srgb, var(--flx-bg) 78%, #fff 6%), color-mix(in srgb, var(--flx-surface) 90%, #000 10%)); border:1px solid rgba(255,255,255,0.14); box-shadow:0 30px 60px -22px rgba(0,0,0,0.65), inset 0 1px 0 rgba(255,255,255,0.08); overflow:hidden; }
    .flx-card__face--back{ transform:rotateY(180deg); align-items:center; text-align:center; }
    .flx-card__face::before{ content:""; position:absolute; inset:0; background:linear-gradient(160deg, color-mix(in srgb, var(--flx-accent) 14%, transparent), transparent 45%); pointer-events:none; }
    .flx-card__clip{ width:52px; height:14px; margin:0 auto 16px; border-radius:5px; background:linear-gradient(180deg, rgba(255,255,255,0.28), rgba(255,255,255,0.05)); border:1px solid rgba(255,255,255,0.22); position:relative; z-index:1; }
    .flx-card__clip::after{ content:""; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,0.35); }
    .flx-card__stripe{ position:absolute; left:0; right:0; top:52px; height:4px; background:linear-gradient(90deg,var(--flx-accent),var(--flx-accent2)); opacity:0.9; z-index:0; }
    .flx-card__brand{ font-family:var(--flx-head); font-weight:700; font-size:36px; letter-spacing:-0.02em; position:relative; z-index:1; }
    .flx-card__brand span{ color:var(--flx-accent); }
    .flx-card__role{ margin-top:6px; color:var(--flx-dim); font-size:12px; letter-spacing:0.16em; text-transform:uppercase; position:relative; z-index:1; }
    .flx-card__id{ margin-top:auto; font-family:var(--flx-mono); font-size:12px; color:var(--flx-accent2); letter-spacing:0.08em; position:relative; z-index:1; }
    .flx-card__hint{ margin-top:10px; font-size:11px; color:var(--flx-dim); opacity:0.7; position:relative; z-index:1; }
    .flx-card__qr{ width:124px; height:124px; margin:8px auto 16px; border-radius:12px; background:#fff; padding:9px; box-shadow:0 8px 22px -8px rgba(0,0,0,0.5); position:relative; z-index:1; }
    .flx-card__qr svg{ width:100%; height:100%; display:block; }
    .flx-card__contact{ font-size:13px; color:var(--flx-text); margin:3px 0; position:relative; z-index:1; }
    @media (prefers-reduced-motion: reduce){ .flx-card-float *{ animation:none !important; transition:none !important; } }
    @media (max-width:480px){ .flx-card-float{ right:12px; } }
    </style>

    <div class="flx-card-float" id="flxLanyardFloat" aria-label="FLUX 工牌">

    <script>
    (function(){
      var floatEl=document.getElementById('flxLanyardFloat');
      var card=document.getElementById('flxLanyardCard');
      var inner=document.getElementById('flxLanyardInner');
      var band=document.getElementById('flxLanyardBand');
      if(!floatEl||!card||!band) return;
      var bx=band.getContext('2d');
      var cssVar=function(n){ return getComputedStyle(floatEl).getPropertyValue(n).trim(); };
      var clamp=function(v,a,b){ return Math.max(a,Math.min(b,v)); };
      var lerp=function(a,b,t){ return a+(b-a)*t; };
      var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var CARD_W=232, CARD_H=300, FW=288, FH=420, Ax=FW/2, Ay=46, L=150;
      var cx=Ax, cy=Ay+L, theta=0, thetaV=0, flipAmt=0, flipTarget=0;
      var dragging=false, grabDX=0, grabDY=0, posX=0, posY=92, velX=0, lastT=0, running=false, raf=null;
      function sizeCanvas(){ var r=floatEl.getBoundingClientRect(); FW=r.width||FW; FH=r.height||FH; var dpr=Math.min(window.devicePixelRatio||1,2); band.width=Math.max(1,Math.floor(FW*dpr)); band.height=Math.max(1,Math.floor(FH*dpr)); bx.setTransform(dpr,0,0,dpr,0,0); }
      function placeFloat(){ floatEl.style.left=posX+'px'; floatEl.style.top=posY+'px'; floatEl.style.right='auto'; }
      function clampPos(){ var vw=window.innerWidth, vh=window.innerHeight; posX=clamp(posX,-FW+90,vw-90); posY=clamp(posY,8,vh-110); placeFloat(); }
      function roundRect(c,x,y,w,h,r){ c.beginPath(); c.moveTo(x+r,y); c.arcTo(x+w,y,x+w,y+h,r); c.arcTo(x+w,y+h,x,y+h,r); c.arcTo(x,y+h,x,y,r); c.arcTo(x,y,x+w,y,r); c.closePath(); }
      function drawClasp(x,y){ bx.save(); bx.fillStyle=cssVar('--flx-surface')||'#15171f'; bx.strokeStyle='rgba(255,255,255,0.18)'; bx.lineWidth=1.5; roundRect(bx,x-26,y-10,52,14,5); bx.fill(); bx.stroke(); bx.restore(); }
      function drawBand(x1,y1,x2,y2){ var g=bx.createLinearGradient(x1,y1,x2,y2); g.addColorStop(0,cssVar('--flx-accent')); g.addColorStop(1,cssVar('--flx-accent2')); bx.save(); bx.lineCap='round'; bx.strokeStyle=g; bx.lineWidth=13; bx.beginPath(); bx.moveTo(x1,y1); bx.lineTo(x2,y2); bx.stroke(); bx.strokeStyle='rgba(255,255,255,0.35)'; bx.lineWidth=3; bx.beginPath(); bx.moveTo(x1,y1); bx.lineTo(x2,y2); bx.stroke(); bx.restore(); }
      function render(){ var tx=cx-CARD_W/2, ty=cy-CARD_H/2; card.style.transform='translate('+tx+'px,'+ty+'px) rotate('+theta+'rad)'; inner.style.transform='rotateY('+(flipAmt*Math.PI)+'rad)'; bx.clearRect(0,0,FW,FH); var axx=cx+(CARD_H/2)*Math.sin(theta); var ayy=cy-(CARD_H/2)*Math.cos(theta); drawClasp(Ax,Ay); drawBand(Ax,Ay,axx,ayy); }
      function step(){ var target=dragging?clamp(-velX*0.0011,-0.55,0.55):0; var STIFF=0.18, DAMP=0.82; thetaV+=(target-theta)*STIFF; thetaV*=DAMP; theta=clamp(theta+thetaV,-0.7,0.7); cx=Ax+L*Math.sin(theta); cy=Ay+L*Math.cos(theta); flipAmt=lerp(flipAmt,flipTarget,0.16); render(); }
      function needRun(){ return dragging||Math.abs(theta)>0.002||Math.abs(thetaV)>0.002||Math.abs(flipAmt-flipTarget)>0.002; }
      function loop(){ if(!running) return; step(); if(needRun()) raf=requestAnimationFrame(loop); else running=false; }
      function start(){ if(!running&&!reduceMotion){ running=true; raf=requestAnimationFrame(loop); } else if(reduceMotion){ step(); } }
      card.addEventListener('pointerdown', function(e){ dragging=true; try{ card.setPointerCapture(e.pointerId); }catch(_){} grabDX=e.clientX-posX; grabDY=e.clientY-posY; velX=0; lastT=performance.now(); start(); e.preventDefault(); });
      card.addEventListener('pointermove', function(e){ if(!dragging) return; var nx=e.clientX-grabDX, ny=e.clientY-grabDY; var now=performance.now(); var dt=Math.max(1,now-lastT)/1000; velX=(nx-posX)/dt; posX=nx; posY=ny; clampPos(); lastT=now; if(reduceMotion) render(); });
      function endDrag(e){ if(!dragging) return; dragging=false; try{ card.releasePointerCapture(e.pointerId); }catch(_){} if(Math.abs(velX)>900) flipTarget=flipTarget?0:1; start(); }
      card.addEventListener('pointerup', endDrag); card.addEventListener('pointercancel', endDrag);
      card.addEventListener('dblclick', function(){ flipTarget=flipTarget?0:1; start(); });
      window.addEventListener('resize', function(){ sizeCanvas(); clampPos(); if(!running) render(); });
      sizeCanvas(); var vw=window.innerWidth; posX=clamp(vw-FW-36,12,vw-90); posY=92; clampPos(); render(); if(!reduceMotion) start();
    })();
    </script>
    <!-- ===================== FLUX 浮动工牌（粘贴块结束） ===================== -->
